[book]
title = "AI/ML Stack Documentation"
authors = ["Head of AI Agent"]
description = "Comprehensive documentation book covering 79 AI/ML tools across 23 functional groups, organized into 4 architectural parts"
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Rocha-Moy-Engineering-Technology/stack"
edit-url-template = "https://github.com/Rocha-Moy-Engineering-Technology/stack/edit/main/books/{path}"

[output.html.search]
enable = true
limit-results = 30
boost-hierarchy = 2

[output.pandoc]
# Requires `mdbook-pandoc` + `pandoc` in PATH.
#
# Note: Once multiple outputs are configured, mdBook writes HTML to `book/html/`.
optional = true

[output.pandoc.profile.markdown]
output-file = "stack-book.md"
to = "gfm"
number-sections = false

[output.pandoc.profile.pdf]
output-file = "stack-book.pdf"
to = "latex"
pdf-engine = "xelatex"
variables = { monofont = "Menlo" }
